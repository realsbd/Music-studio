<!-- 
  MUSIC STUDIO - Interactive 3D Portfolio
  ========================================
  HOW TO RUN: pnpm install, then pnpm dev or open with VS Code Live Server.
  PRODUCTION: pnpm build (Vercel serves the generated dist directory).
  
  NOTE: ES modules do not work from file:// URLs in most browsers.
  You must serve this file over HTTP.
  
  CUSTOMIZATION:
  - Hotspot positions: edit the HOTSPOTS array at the top of main.js
  - BeatStars: replace the iframe placeholder in main.js (beatstars overlay content)
  - YouTube: replace video card links and subscribe URL in main.js
  - Gallery: replace the + slots with <img> tags in main.js
  - Contact form: wire up the submit handler in main.js to your backend or Formspree
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE STUDIO — Premium Recording Experience</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen" data-state="loading">
    <div id="loading-title">THE STUDIO</div>
    <div id="loading-subtitle">Premium Recording Experience</div>
    <div id="loading-bar-wrap" role="progressbar" aria-label="Loading studio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-percent" aria-hidden="true">0%</div>
    <p id="loading-status" role="status" aria-live="polite">Loading the studio…</p>
    <button id="loading-retry" type="button" hidden>Try again</button>
  </div>

  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Vignette overlay -->
  <div id="vignette"></div>

  <!-- Tooltip -->
  <div id="tooltip"></div>

  <!-- HUD hint -->
  <div id="hud-hint">
    <span>Drag to look around</span>
    <div class="dot"></div>
    <span>WASD to walk</span>
    <div class="dot"></div>
    <span>Click glowing orbs to interact</span>
  </div>

  <!-- Overlay -->
  <div id="overlay">
    <div class="overlay-panel" id="overlay-panel-content">
      <!-- dynamically filled by main.js -->
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/",
      "meshoptimizer/": "./node_modules/meshoptimizer/"
    }
  }
  </script>
  <script type="module" src="./bootstrap.js"></script>
</body>
</html>
