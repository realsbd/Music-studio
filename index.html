<!-- 
  MUSIC STUDIO - Interactive 3D Portfolio
  ========================================
  HOW TO RUN: Open with VS Code Live Server OR use:
    python -m http.server 8080
  Then visit http://localhost:8080
  
  NOTE: ES modules do not work from file:// URLs in most browsers.
  You must serve this file over HTTP.
  
  CUSTOMIZATION:
  - Hotspot positions: edit the HOTSPOTS array near the top of the <script> tag
  - BeatStars: replace the iframe placeholder in the beatstars panel
  - YouTube: replace video card links and subscribe URL
  - Gallery: replace the + slots with <img> tags
  - Contact form: wire up the submit handler to your backend or Formspree
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THE STUDIO — Premium Recording Experience</title>

  <!-- Fonts -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap');
  </style>

  <style>
    /* ===== RESET & BASE ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: crosshair;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
    }

    a, button, input, textarea, select {
      cursor: pointer;
    }

    /* ===== CANVAS ===== */
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #canvas-container canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ===== VIGNETTE ===== */
    #vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* ===== LOADING SCREEN ===== */
    #loading-screen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.8s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    #loading-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 10vw, 96px);
      color: #c9a84c;
      letter-spacing: 0.08em;
      line-height: 1;
    }

    #loading-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 1.5vw, 14px);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #aaaaaa;
      font-weight: 300;
    }

    #loading-bar-wrap {
      margin-top: 32px;
      width: min(320px, 60vw);
      height: 2px;
      background: rgba(201,168,76,0.15);
      border-radius: 999px;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      background: #c9a84c;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    #loading-percent {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: rgba(201,168,76,0.6);
      letter-spacing: 0.15em;
    }

    /* ===== TOOLTIP ===== */
    #tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 50;
      background: rgba(10,10,10,0.88);
      border: 1px solid rgba(201,168,76,0.35);
      color: #c9a84c;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 6px;
      display: none;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    /* ===== OVERLAY ===== */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
      padding: 20px;
    }

    #overlay.active {
      display: flex;
    }

    .overlay-panel {
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 16px;
      max-width: 560px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 36px;
      animation: panelIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
      scrollbar-width: thin;
      scrollbar-color: rgba(201,168,76,0.3) transparent;
    }

    .overlay-panel::-webkit-scrollbar {
      width: 4px;
    }

    .overlay-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    .overlay-panel::-webkit-scrollbar-thumb {
      background: rgba(201,168,76,0.3);
      border-radius: 999px;
    }

    @keyframes panelIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== BACK BUTTON ===== */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: 1px solid rgba(201,168,76,0.3);
      color: #c9a84c;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 28px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(201,168,76,0.08);
      border-color: rgba(201,168,76,0.6);
      cursor: pointer;
    }

    /* ===== OVERLAY TYPOGRAPHY ===== */
    .overlay-panel h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      color: #c9a84c;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }

    .overlay-panel p {
      color: #aaaaaa;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 20px;
    }

    /* ===== .btn ===== */
    .btn {
      display: inline-block;
      background: #c9a84c;
      color: #0a0a0a;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 12px 24px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: filter 0.2s ease;
    }

    .btn:hover {
      filter: brightness(1.1);
      cursor: pointer;
    }

    /* ===== IFRAME PLACEHOLDER ===== */
    .iframe-placeholder {
      background: rgba(255,255,255,0.03);
      border: 1px dashed rgba(201,168,76,0.3);
      border-radius: 12px;
      padding: 40px 24px;
      text-align: center;
      margin-bottom: 20px;
    }

    .iframe-placeholder p {
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .iframe-placeholder small {
      display: block;
      color: #666;
      font-size: 12px;
      margin-bottom: 20px;
    }

    /* ===== VIDEO GRID ===== */
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 20px;
    }

    .video-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(201,168,76,0.12);
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .video-card:hover {
      border-color: rgba(201,168,76,0.5);
      transform: translateY(-2px);
      cursor: pointer;
    }

    .video-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .play-btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #c9a84c;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn-circle svg {
      width: 14px;
      height: 14px;
      fill: #0a0a0a;
      margin-left: 2px;
    }

    .video-info {
      padding: 10px 12px;
    }

    .video-info .video-title {
      color: #ffffff;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .video-info .video-link {
      color: #c9a84c;
      font-size: 11px;
      text-decoration: none;
      letter-spacing: 0.05em;
    }

    /* ===== SERVICES GRID ===== */
    .bio-section {
      margin-bottom: 24px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .service-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s ease;
    }

    .service-card:hover {
      border-color: #c9a84c;
    }

    .service-card .service-icon {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .service-card .service-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: #c9a84c;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .service-card .service-desc {
      color: #888;
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 0;
    }

    /* ===== GALLERY GRID ===== */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .gallery-slot {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.04);
      border: 1px dashed rgba(201,168,76,0.3);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease;
      overflow: hidden;
    }

    .gallery-slot:hover {
      border-color: rgba(201,168,76,0.6);
      background: rgba(201,168,76,0.04);
      cursor: pointer;
    }

    .gallery-slot .plus {
      font-size: 28px;
      color: rgba(201,168,76,0.5);
      line-height: 1;
    }

    .gallery-slot .slot-label {
      font-size: 10px;
      color: rgba(201,168,76,0.4);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ===== CONTACT FORM ===== */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .contact-form input,
    .contact-form textarea {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s ease;
      resize: vertical;
      cursor: text;
    }

    .contact-form input::placeholder,
    .contact-form textarea::placeholder {
      color: #555;
    }

    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: #c9a84c;
    }

    .contact-form button.btn {
      align-self: flex-start;
    }

    /* ===== SOCIAL LINKS ===== */
    .social-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .social-link {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(201,168,76,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    .social-link:hover {
      border-color: rgba(201,168,76,0.5);
      background: rgba(201,168,76,0.08);
      cursor: pointer;
    }

    .social-link svg {
      width: 18px;
      height: 18px;
      fill: #c9a84c;
    }

    /* ===== HUD HINT ===== */
    #hud-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(10,10,10,0.75);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 999px;
      padding: 8px 20px;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #hud-hint span {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
    }

    #hud-hint .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(201,168,76,0.5);
    }

    #hud-hint.hidden {
      opacity: 0;
    }

    /* ===== SCROLLBAR global ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.25); border-radius: 999px; }
  </style>
</head>

          <a href="#" target="_blank" class="social-link" title="Instagram">

              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </a>
          <!-- X / Twitter -->
          <a href="#" target="_blank" class="social-link" title="X / Twitter">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
          <!-- YouTube -->
          <a href="#" target="_blank" class="social-link" title="YouTube">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </a>
        </div>
      `
    };

    // =====================================================================
    // DOM REFS
    // =====================================================================
    const loadingScreen   = document.getElementById('loading-screen');
    const loadingBar      = document.getElementById('loading-bar');
    const loadingPercent  = document.getElementById('loading-percent');
    const canvasContainer = document.getElementById('canvas-container');
    const tooltip         = document.getElementById('tooltip');
    const overlay         = document.getElementById('overlay');
    const overlayContent  = document.getElementById('overlay-panel-content');
    const hudHint         = document.getElementById('hud-hint');

    // =====================================================================
    // SCENE
    // =====================================================================
    const scene    = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0a);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffd700, 1.2);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xc9a84c, 0.8);
    pointLight.position.set(0, 3, 0);
    scene.add(pointLight);

    // =====================================================================
    // RENDERER
    // =====================================================================
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    canvasContainer.appendChild(renderer.domElement);

    // =====================================================================
    // CAMERA
    // =====================================================================
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);

    const defaultCameraPos  = new THREE.Vector3(0, 2, 8);
    const defaultLookAt     = new THREE.Vector3(0, 0, 0);
    const targetCameraPos   = defaultCameraPos.clone();
    const targetLookAt      = defaultLookAt.clone();

    // =====================================================================
    // CONTROLS
    // =====================================================================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping    = true;
    controls.dampingFactor    = 0.05;
    controls.minDistance      = 2;
    controls.maxDistance      = 20;
    controls.maxPolarAngle    = Math.PI / 2;
    controls.target.copy(defaultLookAt);
    controls.update();

    // =====================================================================
    // HOTSPOT MESHES
    // =====================================================================
    const hotspotMeshes   = {};  // id → inner sphere
    const outerSpheres    = [];  // for pulse animation
    const hotspotRayTargets = []; // flat list for raycasting

    HOTSPOTS.forEach(hs => {
      // Inner glowing core
      const innerGeo  = new THREE.SphereGeometry(0.08, 16, 16);
      const innerMat  = new THREE.MeshStandardMaterial({
        color: 0xc9a84c,
        emissive: 0xc9a84c,
        emissiveIntensity: 1.5
      });
      const inner = new THREE.Mesh(innerGeo, innerMat);
      inner.position.copy(hs.position);
      inner.userData.hotspotId = hs.id;
      scene.add(inner);
      hotspotMeshes[hs.id] = inner;
      hotspotRayTargets.push(inner);

      // Outer pulse ring
      const outerGeo = new THREE.SphereGeometry(0.14, 16, 16);
      const outerMat = new THREE.MeshStandardMaterial({
        color: 0xc9a84c,
        emissive: 0xc9a84c,
        emissiveIntensity: 0.5,
        transparent: true,
        opacity: 0.3
      });
      const outer = new THREE.Mesh(outerGeo, outerMat);
      outer.position.copy(hs.position);
      outer.userData.hotspotId = hs.id;
      scene.add(outer);
      outerSpheres.push(outer);
    });

    // =====================================================================
    // LOAD GLB
    // =====================================================================
    const loader = new GLTFLoader();
    loader.load(
      './Music_studio.glb',
      (gltf) => {
        const model = gltf.scene;

        // Center & scale
        const box     = new THREE.Box3().setFromObject(model);
        const center  = new THREE.Vector3();
        const size    = new THREE.Vector3();
        box.getCenter(center);
        box.getSize(size);

        const maxDim  = Math.max(size.x, size.y, size.z);
        const scale   = 8 / maxDim;
        model.scale.setScalar(scale);

        // Re-center after scaling
        const box2    = new THREE.Box3().setFromObject(model);
        const center2 = new THREE.Vector3();
        box2.getCenter(center2);
        model.position.sub(center2);

        scene.add(model);

        // Fade out loading screen
        setTimeout(() => {
          loadingScreen.classList.add('fade-out');
          setTimeout(() => { loadingScreen.style.display = 'none'; }, 800);
        }, 300);
      },
      (xhr) => {
        const pct = Math.round((xhr.loaded / xhr.total) * 100);
        loadingBar.style.width = pct + '%';
        loadingPercent.textContent = pct + '%';
      },
      (err) => {
        console.error('GLB load error:', err);
        loadingPercent.textContent = 'Error loading model';
      }
    );

    // =====================================================================
    // RAYCASTING / MOUSE
    // =====================================================================
    const raycaster   = new THREE.Raycaster();
    const mouse       = new THREE.Vector2();
    let mouseDownPos  = { x: 0, y: 0 };
    let activeHotspot = null;
    let hudHidden     = false;

    function updateMouseVec(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x =  ((e.clientX - rect.left) / rect.width)  * 2 - 1;
      mouse.y = -((e.clientY - rect.top)  / rect.height) * 2 + 1;
    }

    window.addEventListener('mousemove', (e) => {
      updateMouseVec(e);

      // Raycast hotspots
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(hotspotRayTargets, false);

      if (hits.length > 0) {
        const hsId = hits[0].object.userData.hotspotId;
        const hs   = HOTSPOTS.find(h => h.id === hsId);
        tooltip.textContent = hs ? hs.label : '';
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top  = (e.clientY - 10) + 'px';
        document.body.style.cursor = 'pointer';
      } else {
        tooltip.style.display = 'none';
        document.body.style.cursor = '';
      }
    });

    window.addEventListener('mousedown', (e) => {
      mouseDownPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', (e) => {
      // Only treat as click if mouse barely moved (not a drag)
      const dx = Math.abs(e.clientX - mouseDownPos.x);
      const dy = Math.abs(e.clientY - mouseDownPos.y);
      if (dx > 5 || dy > 5) return;

      updateMouseVec(e);
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(hotspotRayTargets, false);
      if (hits.length > 0) {
        const hsId = hits[0].object.userData.hotspotId;
        activateHotspot(hsId);
      }
    });

    // =====================================================================
    // HOTSPOT ACTIVATE / DEACTIVATE
    // =====================================================================
    function activateHotspot(id) {
      const hs = HOTSPOTS.find(h => h.id === id);
      if (!hs) return;

      activeHotspot = id;
      controls.enabled = false;
      tooltip.style.display = 'none';

      // Hide all hotspot meshes during zoom
      hotspotRayTargets.forEach(m => m.visible = false);
      outerSpheres.forEach(m => m.visible = false);

      // Move camera
      targetCameraPos.copy(hs.cameraPos);
      targetLookAt.copy(hs.cameraLookAt);

      // Show overlay after camera arrives
      setTimeout(() => {
        overlayContent.innerHTML = OVERLAY_CONTENT[id] || `<button class="back-btn" id="back-btn">← Back</button><h2>${hs.label}</h2>`;
        overlay.classList.add('active');

        // Wire up contact form if present
        const form = document.getElementById('contact-form');
        if (form) {
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Message sent! (Wire up to your backend or Formspree to make this work.)');
          });
        }

        // Wire up back button
        const backBtn = document.getElementById('back-btn');
        if (backBtn) {
          backBtn.addEventListener('click', deactivateHotspot);
        }

        // Hide HUD hint once user interacted
        if (!hudHidden) {
          hudHint.classList.add('hidden');
          hudHidden = true;
        }
      }, 900);
    }

    function deactivateHotspot() {
      overlay.classList.remove('active');
      controls.enabled = true;

      targetCameraPos.copy(defaultCameraPos);
      targetLookAt.copy(defaultLookAt);

      activeHotspot = null;

      // Restore hotspot markers
      hotspotRayTargets.forEach(m => m.visible = true);
      outerSpheres.forEach(m => m.visible = true);
    }

    // Also allow clicking the dark overlay background to close
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) deactivateHotspot();
    });

    // =====================================================================
    // RESIZE
    // =====================================================================
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // =====================================================================
    // ANIMATION LOOP
    // =====================================================================
    function animate() {
      requestAnimationFrame(animate);

      // Smooth camera lerp
      camera.position.lerp(targetCameraPos, 0.06);
      controls.target.lerp(targetLookAt, 0.06);

      // Pulse outer spheres
      const t = Date.now() * 0.003;
      outerSpheres.forEach((sphere, i) => {
        sphere.scale.setScalar(1 + 0.3 * Math.sin(t + i * 0.7));
      });

      // Slowly rotate inner orbs for extra life
      hotspotRayTargets.forEach((mesh) => {
        mesh.rotation.y += 0.008;
      });

      controls.update();
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
